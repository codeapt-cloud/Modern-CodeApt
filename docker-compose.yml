# CodeApt infrastructure.
#
#   docker compose up -d
#       PRODUCTION shape. Starts ONLY the app services (api, worker, asr, web,
#       piston). It does NOT start a database — api/worker connect to the
#       managed Mongo + Redis named in .env (MONGODB_URI / REDIS_URL). This is
#       the point: production must never accidentally run — or connect to — a
#       throwaway local database (see "WHY THESE GUARDS EXIST" below).
#
#   docker compose --profile local-db up -d mongo redis
#       LOCAL DEV data stores for `pnpm dev` — a disposable Mongo + Redis bound
#       to 127.0.0.1 only. Opt-in on purpose; never on by default.
#
#   docker compose --profile local-db up -d --build
#       LOCAL full stack in containers (app services + the local data stores).
#
# ---------------------------------------------------------------------------
# WHY THESE GUARDS EXIST — do not "simplify" them away.
#
#   During a live incident a routine rebuild silently pointed PRODUCTION at an
#   empty local Mongo: the compose file HARDCODED
#       MONGODB_URI: mongodb://mongo:27017/codeapt
#   which WON over the real URI in .env, so the api connected to a fresh, empty
#   container instead of the production database. CORS_ORIGIN was likewise
#   hardcoded to http://localhost:5173, breaking the real origin.
#
#   The fixes, all of which must stay:
#     1. MONGODB_URI / REDIS_URL / CORS_ORIGIN / the JWT secrets come from .env
#        and are REQUIRED (${VAR:?...}) — a missing value fails the `up` LOUDLY
#        instead of silently falling back to a wrong/empty default. There are no
#        hardcoded connection strings and no baked-in dev JWT secrets any more.
#     2. mongo + redis live behind the OPT-IN `local-db` profile, so a bare
#        `up` in production cannot start (or reconnect to) a local database.
#     3. local mongo/redis publish to 127.0.0.1 ONLY — never a public interface.
#     4. api + worker load the WHOLE `.env` via `env_file:`, so every var the
#        apps read (ENCRYPTION_KEY, ASR_URL, CLOUDINARY_*, ESSAY_LLM_*, …) reaches
#        the container — no capability silently degrades because a var wasn't
#        hand-listed in `environment:` (the Step-28 incident: .env had
#        ENCRYPTION_KEY / ASR_URL / CLOUDINARY_* but NONE reached api).
#
#   env_file vs environment — PRECEDENCE (compose): the `environment:` block
#   WINS over `env_file` for any key it sets. So `env_file: .env` supplies the
#   long tail, while `environment:` still pins NODE_ENV=production and enforces
#   the ${VAR:?} guards (fed by compose's own ./.env interpolation) for the
#   must-never-be-missing vars. Both read the same repo-root .env.
# ---------------------------------------------------------------------------

services:
  # ==== App services — started by a bare `docker compose up -d` ====

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codeapt-api
    restart: unless-stopped
    # CPU ceiling (see the budget note on the asr service). The API is IO-bound
    # (it coordinates; the heavy CPU work is Piston/ASR/worker), so a single
    # process with 2 cores of headroom carries MCQ/text loads into the low
    # thousands concurrent. Scaling PAST that needs multiple API replicas, which
    # is NOT drop-in here: the auto-submit sweep (index.ts setInterval) would run
    # once per replica, and the express-rate-limit limiters use an in-process
    # store — both must become single-instance / Redis-backed first.
    cpus: "2.0"
    # No depends_on for mongo/redis: in production those are MANAGED (external,
    # via .env), and the local containers are opt-in behind the `local-db`
    # profile — a depends_on would break a bare `up` (dependency not enabled)
    # and is unnecessary (mongoose/ioredis retry the connection on boot).
    #
    # Load the WHOLE .env so optional-but-important vars (ENCRYPTION_KEY, ASR_URL,
    # CLOUDINARY_*, ESSAY_LLM_*) reach the app. `environment:` below still wins
    # for the keys it sets (precedence: environment > env_file).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # REQUIRED from .env — no hardcoded fallback (see the incident note above).
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env (the managed database — NOT a local container)}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env (the real web origin, e.g. https://app.example.com)}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: codeapt-worker
    restart: unless-stopped
    cpus: "2.0"
    # Same as api: load the whole .env so ENCRYPTION_KEY / ASR_URL / ESSAY_LLM_*
    # reach the worker; `environment:` still wins for the keys it sets.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env (the managed database — NOT a local container)}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      # Jobs run in parallel. The worker mostly WAITS on Piston/ASR (IO-bound
      # orchestration), so this can comfortably exceed its core count; the real
      # execution CPU is bounded by the piston/asr caps. 8 keeps a coding-exam
      # "Run" burst moving without letting it flood Piston. (The speech queue has
      # its own tighter concurrency cap in the worker so ASR can't be swamped.)
      WORKER_CONCURRENCY: "8"
      # Self-hosted Piston on the compose network (service `piston`, below). A
      # self-hosted instance serves its API at /api/v2 (the ".../piston" segment
      # is public-emkc routing only). Override via .env to point elsewhere.
      PISTON_URL: ${PISTON_URL:-http://piston:2000/api/v2}
      PISTON_TIMEOUT_MS: "15000"
      # Speech transcription (Communication A/B) — the self-hosted ASR container.
      ASR_URL: ${ASR_URL:-http://asr:2600}
      ASR_TIMEOUT_MS: "30000"

  # faster-whisper ASR (Communication speech spine). CPU-heavy per request.
  #
  # CPU BUDGET — THIS BOX IS AN 8 vCPU / 32 GB VPS, co-locating EVERY service
  # (app + Mongo + Redis + Piston), and must stay robust whether the load is
  # MCQ, coding, OR speech exams. Every CPU-using service below carries a `cpus:`
  # ceiling so no single service can monopolise the box during a burst. These
  # are CEILINGS, not reservations: a service may burst into cores its idle
  # neighbours aren't using, but can never exceed its own cap. The ceilings sum
  # to slightly MORE than 8 on purpose (asr 3 + piston 2.5 + worker 2 + api 2 +
  # mongo 1.5 + redis 0.5 = 11.5) so spare capacity is shareable while the
  # greediest tenants (ASR, Piston) are still bounded. The split favours the two
  # heaviest paths — speech (asr) and code execution (piston) — because those,
  # not the IO-bound API, are what cap coding/speech throughput.
  #
  #   Re-tune only if the box changes size:
  #     4 vCPU: asr 2.0, piston 1.5, worker 1.0, api 1.0, mongo 1.0, redis 0.5
  #     16 vCPU: asr 5.0, piston 5.0, worker 4.0, api 3.0, mongo 2.0, redis 1.0
  # ASR_THREADS bounds the model's own thread pool as a second lever (≤ cpus).
  asr:
    build:
      context: .
      dockerfile: apps/asr/Dockerfile
    container_name: codeapt-asr
    restart: unless-stopped
    cpus: "3.0"
    # NO env_file on purpose. Unlike api/worker, this Python service reads NONE
    # of the shared .env vars — only ASR_MODEL / ASR_COMPUTE / ASR_THREADS /
    # PIPER_BIN / TTS_VOICE_* / TTS_MAX_CHARS (Dockerfile ENV defaults, overridden
    # here). Mounting .env would only leak the DB/JWT/Cloudinary secrets into a
    # container that ignores them (least privilege). If a TTS voice override is
    # ever moved into .env, add `env_file: [.env]` here at that point.
    environment:
      ASR_MODEL: small
      ASR_COMPUTE: int8
      # Match the cpus ceiling above so the model actually uses its cores.
      ASR_THREADS: "3"
    ports:
      - "2600:2600"

  # Self-hosted Piston (code execution). The worker reaches it as `piston:2000`
  # over the compose network (the service name IS the network alias), so
  # PISTON_URL=http://piston:2000/api/v2 keeps resolving.
  #
  # CRITICAL — THE RUNTIMES LIVE IN AN EXTERNAL VOLUME. `piston-data` holds the
  # INSTALLED language runtimes (Python/Java/C++/JS) under /piston/packages. It
  # is declared `external` (below) with the EXACT existing name so compose
  # REATTACHES it and never creates a fresh, empty one — recreating it empty
  # would break code execution for every student until the runtimes were
  # reinstalled. No host port is published on purpose: Piston executes arbitrary
  # code and must not be reachable from the public internet — only from the
  # worker on the internal network.
  #
  # CONFIRM BEFORE `up`: the image tag + privileged flag here must match the
  # running container. Inspect it first (see the runbook) and reconcile this
  # service if it differs; the volume reattaches regardless, but the container
  # is recreated if its config changed.
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: codeapt-piston
    restart: unless-stopped
    privileged: true
    # CPU ceiling (see the budget note on the asr service). Code execution is the
    # ceiling for coding exams; capping it keeps a stampede of "Run" clicks from
    # eating every core and starving the API/Mongo.
    cpus: "2.5"
    volumes:
      - piston-data:/piston/packages

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: codeapt-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  # ==== Data stores — OPT-IN via `--profile local-db` (local dev only) ====
  # Not started by a bare `up`, so production cannot accidentally run an empty
  # local database. Published to 127.0.0.1 ONLY (never a public interface).

  mongo:
    profiles: ["local-db"]
    image: mongo:7
    container_name: codeapt-mongo
    restart: unless-stopped
    # CPU ceiling (see the budget note on the asr service). Once the DB is
    # self-hosted here (migrated off the managed tier) this is the primary
    # database, not a throwaway dev store.
    cpus: "1.5"
    # Bound the WiredTiger cache so Mongo can't balloon into the RAM the app
    # services need. On 32 GB, ~8 GB is generous for the cached/indexed working
    # set; the OS file cache uses the rest. Raise only if the dataset outgrows it.
    command: ["--wiredTigerCacheSizeGB", "8"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["local-db"]
    image: redis:7-alpine
    container_name: codeapt-redis
    restart: unless-stopped
    cpus: "0.5"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  # The installed-runtimes volume for Piston. EXTERNAL with its exact existing
  # name so compose reattaches the runtimes rather than creating an empty one.
  # If you ever start fresh, create it explicitly:
  #   docker volume create modern-codeapt_piston-data
  # then install runtimes via the Piston package API.
  piston-data:
    external: true
    name: modern-codeapt_piston-data
